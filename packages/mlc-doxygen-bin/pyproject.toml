[build-system]
requires = ["scikit-build-core>=0.11", "cmake>=3.26", "ninja"]
build-backend = "scikit_build_core.build"

[project]
name = "mlc-doxygen-bin"
dynamic = ["version"]
description = "Prebuilt Doxygen command-line executable"
readme = "README.md"
requires-python = ">=3.8"
license = "GPL-2.0-only"
license-files = ["LICENSE"]
authors = [{ name = "MLC AI", email = "mlc.ai.dev@gmail.com" }]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Topic :: Documentation",
  "Topic :: Software Development :: Documentation",
]

[project.optional-dependencies]
# Run with: pip install ".[test]" && pytest
test = ["pytest"]

[project.urls]
Doxygen = "https://github.com/doxygen/doxygen"
Repository = "https://github.com/mlc-ai/package"

[project.scripts]
doxygen = "mlc_doxygen_bin.cli:main"

[tool.scikit-build]
cmake.version = ">=3.26"
wheel.py-api = "py3"
wheel.packages = ["python/mlc_doxygen_bin"]
sdist.exclude = [
  "build",
  "dist",
  "wheelhouse",
  "python/mlc_doxygen_bin/bin",
  "python/mlc_doxygen_bin/licenses",
  "python/mlc_doxygen_bin/doxygen.json",
  "python/mlc_doxygen_bin/_version.py",
]

# version.py is the single version source; the build generates the runtime
# python/mlc_doxygen_bin/_version.py from it (see scripts/prepare_doxygen.py).
[tool.scikit-build.metadata.version]
provider = "scikit_build_core.metadata.regex"
input = "version.py"

[tool.cibuildwheel]
# CIBW_BUILD selects the Python used to run the build. scikit-build-core tags
# the output wheel py3-none because this package exposes a native executable,
# not a CPython ABI extension.
build = "cp311-*"
build-frontend = "build"
build-verbosity = 1
skip = "*-musllinux_*"
test-extras = ["test"]
test-command = "pytest {project}/tests/python -q"

[tool.cibuildwheel.linux]
manylinux-x86_64-image = "manylinux_2_28"
manylinux-aarch64-image = "manylinux_2_28"
before-all = "bash scripts/install_manylinux_build_tools.sh"
repair-wheel-command = "python scripts/copy_wheel.py {wheel} {dest_dir}"

[tool.cibuildwheel.macos]
repair-wheel-command = "python scripts/copy_wheel.py {wheel} {dest_dir}"

[tool.cibuildwheel.windows]
repair-wheel-command = "python scripts/copy_wheel.py {wheel} {dest_dir}"

[tool.pytest.ini_options]
testpaths = ["tests/python"]
