[build-system]
requires = ["scikit-build-core>=0.11", "cmake>=3.26", "ninja"]
build-backend = "scikit_build_core.build"

[project]
name = "mlc-z3-static"
dynamic = ["version"]
description = "Prebuilt Z3 static and shared libraries, headers, and CMake metadata"
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "MLC AI", email = "mlc.ai.dev@gmail.com" }]
keywords = ["z3", "smt", "static-library", "cmake"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: C++",
  "Topic :: Software Development :: Build Tools",
]

[project.optional-dependencies]
# Run with: pip install ".[test]" && pytest
test = ["pytest", "cmake>=3.26", "ninja"]

[project.urls]
Repository = "https://github.com/mlc-ai/package"
Z3 = "https://github.com/Z3Prover/z3"

[tool.scikit-build]
cmake.version = ">=3.26"
wheel.py-api = "py3"
wheel.packages = ["python/mlc_z3_static"]
sdist.exclude = [
  "build",
  "dist",
  "wheelhouse",
  "example_project/build",
  "example_project/.venv",
  "python/mlc_z3_static/static",
  "python/mlc_z3_static/shared",
  "python/mlc_z3_static/licenses",
  "python/mlc_z3_static/staticlib.json",
  "python/mlc_z3_static/_version.py",
]

# version.py is the single version source; the build generates the runtime
# python/mlc_z3_static/_version.py from it (see scripts/prepare_z3.py).
[tool.scikit-build.metadata.version]
provider = "scikit_build_core.metadata.regex"
input = "version.py"

[tool.cibuildwheel]
# CIBW_BUILD selects the Python used to run the build. scikit-build-core tags
# the output wheel py3-none because this package exposes native development
# artifacts, not a CPython ABI extension.
build = "cp311-*"
build-frontend = "build"
build-verbosity = 1
skip = "*-musllinux_* pp*"
test-extras = ["test"]
test-command = "pytest {project}/tests/python -q"

[tool.cibuildwheel.linux]
manylinux-x86_64-image = "manylinux_2_28"
manylinux-aarch64-image = "manylinux_2_28"
repair-wheel-command = "python scripts/copy_wheel.py {wheel} {dest_dir}"

[tool.cibuildwheel.macos]
repair-wheel-command = "python scripts/copy_wheel.py {wheel} {dest_dir}"

[tool.cibuildwheel.windows]
repair-wheel-command = "python scripts/copy_wheel.py {wheel} {dest_dir}"

[tool.pytest.ini_options]
testpaths = ["tests/python"]
