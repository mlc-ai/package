name: Build LLVM static SDK wheels

on:
  pull_request:
    paths:
      - "packages/mlc-llvm-static/**"
      - "packages/mlc-llvm-static-extra-targets/**"
      - ".github/workflows/mlc_llvm_static_wheel.yml"
  workflow_dispatch:
    inputs:
      package_version:
        description: Package version (LLVM is pinned to 23.1.1)
        default: "23.1.1.dev3"
        required: true
      publish_release:
        description: Upload both wheel families to a new draft GitHub prerelease
        default: false
        type: boolean
      platform:
        description: Host platform to validate (publishing requires all)
        default: all
        type: choice
        options: [all, manylinux_2_28_x86_64, manylinux_2_28_aarch64, macosx_14_0_arm64, win_amd64]

permissions:
  contents: read

concurrency:
  group: llvm-sdk-split-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  PACKAGE_VERSION: ${{ inputs.package_version || '23.1.1.dev3' }}

jobs:
  checks:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.platforms.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install pytest build
      - run: python -m pytest packages/mlc-llvm-static/tests -q
      - name: Select validation platforms
        id: platforms
        env:
          SDK_PLATFORM: ${{ inputs.platform || 'all' }}
          PUBLISH_RELEASE: ${{ inputs.publish_release }}
        run: |
          python - <<'PY'
          import json, os
          rows = [
              dict(name="Linux x86_64", os="ubuntu-latest", tag="manylinux_2_28_x86_64", image="quay.io/pypa/manylinux_2_28_x86_64:latest"),
              dict(name="Linux aarch64", os="ubuntu-24.04-arm", tag="manylinux_2_28_aarch64", image="quay.io/pypa/manylinux_2_28_aarch64:latest"),
              dict(name="macOS arm64", os="macos-15", tag="macosx_14_0_arm64"),
              dict(name="Windows AMD64", os="windows-2022", tag="win_amd64"),
          ]
          selected = os.environ["SDK_PLATFORM"]
          if selected != "all":
              if os.environ.get("PUBLISH_RELEASE") == "true":
                  raise SystemExit("Release publishing requires platform=all")
              rows = [row for row in rows if row["tag"] == selected]
          if not rows:
              raise SystemExit("Unknown SDK platform")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write("matrix=" + json.dumps(dict(include=rows)) + "\n")
          PY
      - name: Build both source distributions
        run: |
          python -m build --sdist packages/mlc-llvm-static
          python -m build --sdist packages/mlc-llvm-static-extra-targets

  build_wheels:
    needs: checks
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.checks.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Initialize MSVC for Ninja
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
      - name: Stamp both package versions
        shell: bash
        run: |
          python - <<'PY'
          import os, re
          from pathlib import Path
          version = os.environ["PACKAGE_VERSION"]
          if not re.fullmatch(r"23\.1\.1(?:(?:a|b|rc)\d+|\.post\d+|\.dev\d+)?", version):
              raise SystemExit("Package version must be based on LLVM 23.1.1")
          for name in ("mlc-llvm-static", "mlc-llvm-static-extra-targets"):
              project = Path("packages") / name
              metadata = project / "pyproject.toml"
              metadata.write_text(re.sub(r"(mlc-llvm-static(?:-extra-targets)?==)[^\"\]]+", lambda m: m[1] + version, metadata.read_text()))
              path = project / ("src/mlc_llvm_static/_version.py" if name == "mlc-llvm-static" else "version.py")
              path.write_text(re.sub(r'__version__ = "[^"]+"', f'__version__ = "{version}"', path.read_text()))
          PY
      - name: Fingerprint compiled SDK recipe
        id: recipe
        shell: bash
        run: python packages/mlc-llvm-static/scripts/cache_key.py >> "$GITHUB_OUTPUT"
      - name: Restore compiled All-target SDK
        id: sdk_cache
        uses: actions/cache/restore@v4
        with:
          path: packages/mlc-llvm-static/.sdk-cache
          key: llvm-all-sdk-${{ matrix.tag }}-${{ steps.recipe.outputs.key }}
          restore-keys: ${{ steps.recipe.outputs.compatible_key && format('llvm-all-sdk-{0}-{1}', matrix.tag, steps.recipe.outputs.compatible_key) || '' }}
      - name: Build and verify Linux wheels in manylinux
        if: runner.os == 'Linux'
        working-directory: packages/mlc-llvm-static
        env:
          IMAGE: ${{ matrix.image }}
          PLATFORM_TAG: ${{ matrix.tag }}
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/project" -w /project/packages/mlc-llvm-static \
            -e PLATFORM_TAG -e MLC_LLVM_STATIC_ALLOW_SOURCE_BUILD=1 \
            -e MLC_LLVM_STATIC_USE_CACHE=1 -e MLC_LLVM_STATIC_CLEAN_BUILD=1 -e CMAKE_BUILD_PARALLEL_LEVEL=4 \
            "$IMAGE" bash -c '
              export PATH="/opt/python/cp311-cp311/bin:$PATH"
              python -m pip install build scikit-build-core cmake ninja wheel
              python scripts/build_wheels.py --platform-tag "$PLATFORM_TAG"
              python scripts/verify_split_wheels.py wheelhouse
            '
      - name: Build and verify macOS and Windows wheels
        if: runner.os != 'Linux'
        working-directory: packages/mlc-llvm-static
        shell: bash
        env:
          PLATFORM_TAG: ${{ matrix.tag }}
          MLC_LLVM_STATIC_ALLOW_SOURCE_BUILD: "1"
          MLC_LLVM_STATIC_USE_CACHE: "1"
          MLC_LLVM_STATIC_CLEAN_BUILD: "1"
          CMAKE_BUILD_PARALLEL_LEVEL: "3"
          MACOSX_DEPLOYMENT_TARGET: "14.0"
        run: |
          python -m pip install build scikit-build-core cmake ninja wheel
          python scripts/build_wheels.py --platform-tag "$PLATFORM_TAG"
          python scripts/verify_split_wheels.py wheelhouse
      - name: Save compiled SDK even if packaging or validation failed
        if: always() && steps.sdk_cache.outputs.cache-hit != 'true' && hashFiles('packages/mlc-llvm-static/.sdk-cache/all-sdk.zip') != ''
        uses: actions/cache/save@v4
        with:
          path: packages/mlc-llvm-static/.sdk-cache
          key: ${{ steps.sdk_cache.outputs.cache-primary-key }}
      - uses: actions/upload-artifact@v4
        with:
          name: mlc-llvm-static-${{ matrix.tag }}
          path: packages/mlc-llvm-static/wheelhouse/*.whl
          if-no-files-found: error

  release:
    name: Draft GitHub release
    needs: build_wheels
    if: github.event_name == 'workflow_dispatch' && inputs.publish_release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: mlc-llvm-static-*
          path: dist
          merge-multiple: true
      - name: Create draft prerelease with eight verified wheels and checksums
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path
          wheels = sorted(Path("dist").glob("*.whl"))
          if len(wheels) != 8:
              raise SystemExit(f"Expected two wheel families for four platforms, found {len(wheels)}")
          Path("dist/SHA256SUMS").write_text("".join(
              hashlib.sha256(path.read_bytes()).hexdigest() + "  " + path.name + "\n" for path in wheels))
          PY
          cat > release-notes.md <<'EOF'
          Experimental LLVM 23.1.1 static SDK with a Native base and All-target add-on.

          Install mlc_llvm_static for your host platform for native code generation.
          Install the matching mlc_llvm_static_extra_targets wheel to enable all
          standard LLVM backends. Both wheels own disjoint files in one SDK prefix
          and must come from the same SDK build. llvm-config is a Python frontend.

          Includes static zlib/zstd and the Linux host ORC runtime. Clang, linkers,
          other LLVM tools, target sysroots, and experimental backends are excluded.
          Validation covers both profiles, cross-target object generation, static
          dependencies, relocation, and removal of the add-on. No PyPI upload.
          EOF
          gh release create "mlc-llvm-static-v${PACKAGE_VERSION}" dist/* \
            --target "$GITHUB_SHA" --draft --prerelease \
            --title "LLVM static SDK ${PACKAGE_VERSION}" --notes-file release-notes.md
