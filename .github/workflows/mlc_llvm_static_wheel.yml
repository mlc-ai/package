name: Validate released LLVM SDK dependencies
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux:
    name: Linux ${{ matrix.arch }} dependency probes
    runs-on: ${{ matrix.os }}
    container: quay.io/pypa/manylinux_2_28_${{ matrix.arch }}:latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            os: ubuntu-latest
            tag: manylinux_2_28_x86_64
          - arch: aarch64
            os: ubuntu-24.04-arm
            tag: manylinux_2_28_aarch64
    steps:
      - uses: actions/checkout@v4
      - name: Install tooling and the released SDK
        shell: bash
        env:
          SDK_TAG: ${{ matrix.tag }}
        run: |
          export PATH="/opt/python/cp311-cp311/bin:/opt/rh/gcc-toolset-14/root/usr/bin:$PATH"
          echo /opt/python/cp311-cp311/bin >> "$GITHUB_PATH"
          echo /opt/rh/gcc-toolset-14/root/usr/bin >> "$GITHUB_PATH"
          python -m pip install cmake ninja pytest
          python .github/install-released-sdk.py
      - run: python -m pytest packages/mlc-llvm-static/tests -q
      - run: python packages/mlc-llvm-static/scripts/verify_wheel.py
  native:
    name: ${{ matrix.name }} dependency probes
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64
            os: macos-15
            tag: macosx_14_0_arm64
          - name: Windows AMD64
            os: windows-2022
            tag: win_amd64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - name: Install tooling and the released SDK
        shell: bash
        env:
          SDK_TAG: ${{ matrix.tag }}
        run: |
          python -m pip install cmake ninja pytest
          python .github/install-released-sdk.py
      - run: python -m pytest packages/mlc-llvm-static/tests -q
      - run: python packages/mlc-llvm-static/scripts/verify_wheel.py
