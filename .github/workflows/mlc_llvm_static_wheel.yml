name: Publish mlc-llvm-static wheels

on:
  # Pull requests build only when this package (other than docs) or this workflow changes.
  pull_request:
    paths:
      - "packages/mlc-llvm-static/**"
      - "!packages/mlc-llvm-static/**/*.md"
      - ".github/workflows/mlc_llvm_static_wheel.yml"
  workflow_dispatch:
    inputs:
      version_suffix:
        description: Python package version suffix, such as .post1
        required: false
        default: ""
      publish:
        description: Publish to PyPI
        type: boolean
        required: true
        default: false
      repository_url:
        description: Custom PyPI-compatible repository URL
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: llvm-sdk-split-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.platforms.outputs.matrix }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: python -m pip install pytest packaging
      - name: Resolve and stamp package versions
        id: version
        env:
          VERSION_SUFFIX: ${{ inputs.version_suffix }}
        run: >-
          python packages/mlc-llvm-static/scripts/stamp_version.py
          --suffix "$VERSION_SUFFIX"
      - run: python -m pytest packages/mlc-llvm-static/tests/python -q
      - name: Define validation platforms
        id: platforms
        run: |
          python - <<'PY'
          import json, os
          rows = [
              dict(name="Linux x86_64", os="ubuntu-latest", arch="x64", tag="manylinux_2_28_x86_64", image="quay.io/pypa/manylinux_2_28_x86_64:latest"),
              dict(name="Linux aarch64", os="ubuntu-24.04-arm", arch="arm64", tag="manylinux_2_28_aarch64", image="quay.io/pypa/manylinux_2_28_aarch64:latest"),
              dict(name="macOS arm64", os="macos-15", arch="arm64", tag="macosx_14_0_arm64"),
              dict(name="Windows AMD64", os="windows-2022", arch="x64", tag="win_amd64"),
              dict(name="Windows ARM64", os="windows-11-vs2026-arm", arch="arm64", tag="win_arm64", compiler="clang-cl"),
          ]
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write("matrix=" + json.dumps(dict(include=rows)) + "\n")
          PY

  build_wheels:
    needs: checks
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 360
    env:
      PACKAGE_VERSION: ${{ needs.checks.outputs.version }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.checks.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          architecture: ${{ matrix.arch }}
      - uses: ./.github/actions/detect-env-vars
      - name: Install version helper dependency
        run: python -m pip install packaging
      - name: Initialize MSVC for Ninja
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.arch }}
      - name: Stamp both package versions
        shell: bash
        run: python packages/mlc-llvm-static/scripts/stamp_version.py "$PACKAGE_VERSION"
      - name: Fingerprint compiled SDK recipe
        id: recipe
        shell: bash
        env:
          CC: ${{ matrix.compiler }}
          CXX: ${{ matrix.compiler }}
        run: python packages/mlc-llvm-static/scripts/cache_key.py >> "$GITHUB_OUTPUT"
      - name: Restore compiled All-target SDK
        id: sdk_cache
        uses: actions/cache/restore@v5
        with:
          path: packages/mlc-llvm-static/.sdk-cache
          key: llvm-all-sdk-${{ matrix.tag }}-${{ steps.recipe.outputs.key }}
      - name: Build and verify Linux wheels in manylinux
        if: runner.os == 'Linux'
        working-directory: packages/mlc-llvm-static
        env:
          IMAGE: ${{ matrix.image }}
          PLATFORM_TAG: ${{ matrix.tag }}
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/project" -w /project/packages/mlc-llvm-static \
            -e PLATFORM_TAG -e MLC_LLVM_STATIC_ALLOW_SOURCE_BUILD=1 \
            -e MLC_LLVM_STATIC_USE_CACHE=1 -e MLC_LLVM_STATIC_CLEAN_BUILD=1 -e CMAKE_BUILD_PARALLEL_LEVEL \
            "$IMAGE" bash -c '
              export PATH="/opt/python/cp311-cp311/bin:$PATH"
              python -m pip install build scikit-build-core cmake ninja wheel
              python scripts/build_wheels.py --platform-tag "$PLATFORM_TAG"
              python scripts/verify_split_wheels.py wheelhouse
            '
      - name: Build macOS and Windows wheels
        if: runner.os != 'Linux'
        working-directory: packages/mlc-llvm-static
        shell: bash
        env:
          PLATFORM_TAG: ${{ matrix.tag }}
          # MSVC's ARM64 optimizer exhausts its heap on the AMDGPU asm writer.
          CC: ${{ matrix.compiler }}
          CXX: ${{ matrix.compiler }}
          MLC_LLVM_STATIC_ALLOW_SOURCE_BUILD: "1"
          MLC_LLVM_STATIC_USE_CACHE: "1"
          MLC_LLVM_STATIC_CLEAN_BUILD: "1"
          MACOSX_DEPLOYMENT_TARGET: "14.0"
        run: |
          python -m pip install build scikit-build-core cmake ninja wheel
          python scripts/build_wheels.py --platform-tag "$PLATFORM_TAG"
      - name: Verify macOS and Windows consumers with the default compiler
        if: runner.os != 'Linux'
        working-directory: packages/mlc-llvm-static
        shell: bash
        run: python scripts/verify_split_wheels.py wheelhouse
      - name: Save compiled SDK even if packaging or validation failed
        if: always() && steps.sdk_cache.outputs.cache-hit != 'true' && hashFiles('packages/mlc-llvm-static/.sdk-cache/all-sdk.zip') != ''
        uses: actions/cache/save@v5
        with:
          path: packages/mlc-llvm-static/.sdk-cache
          key: ${{ steps.sdk_cache.outputs.cache-primary-key }}
      - name: Upload native wheel
        uses: actions/upload-artifact@v6
        with:
          name: mlc-llvm-static-${{ matrix.tag }}
          path: packages/mlc-llvm-static/wheelhouse/mlc_llvm_static-*.whl
          if-no-files-found: error
      - name: Upload extra-targets wheel
        uses: actions/upload-artifact@v6
        with:
          name: mlc-llvm-static-extra-targets-${{ matrix.tag }}
          path: packages/mlc-llvm-static/wheelhouse/mlc_llvm_static_extra_targets-*.whl
          if-no-files-found: error

  distributions:
    name: Validate wheel distributions
    needs: [checks, build_wheels]
    runs-on: ubuntu-latest
    env:
      PACKAGE_VERSION: ${{ needs.checks.outputs.version }}
      PLATFORM_MATRIX: ${{ needs.checks.outputs.matrix }}
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v7
        with:
          pattern: mlc-llvm-static-*
          path: dist
          merge-multiple: true
      - name: Check complete wheel set
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          wheels = sorted(Path("dist").glob("*.whl"))
          expected = {f"{family}-{os.environ['PACKAGE_VERSION']}-py3-none-{row['tag']}.whl"
                      for row in json.loads(os.environ["PLATFORM_MATRIX"])["include"]
                      for family in ("mlc_llvm_static", "mlc_llvm_static_extra_targets")}
          if {path.name for path in wheels} != expected:
              raise SystemExit("Release wheels do not match all platforms and package version")
          PY
      - name: Verify distribution metadata
        run: |
          python -m pip install twine
          python -m twine check --strict dist/*.whl
      - name: Summarize wheel sizes
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          from pathlib import Path
          print("| Wheel | Size (MB) |")
          print("| --- | ---: |")
          for path in sorted(Path("dist").glob("*.whl")):
              print(f"| `{path.name}` | {path.stat().st_size / 1e6:.1f} |")
          PY
      - name: Stage native wheels for PyPI
        if: ${{ inputs.publish }}
        uses: actions/upload-artifact@v6
        with:
          name: pypi-mlc-llvm-static
          path: dist/mlc_llvm_static-*.whl
          if-no-files-found: error
      - name: Stage extra-target wheels for PyPI
        if: ${{ inputs.publish }}
        uses: actions/upload-artifact@v6
        with:
          name: pypi-mlc-llvm-static-extra-targets
          path: dist/mlc_llvm_static_extra_targets-*.whl
          if-no-files-found: error

  publish_pypi:
    name: Publish ${{ matrix.project }} to PyPI
    needs: distributions
    if: ${{ inputs.publish }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: mlc-llvm-static
            environment: pypi
          - project: mlc-llvm-static-extra-targets
            environment: pypi-all-targets
    environment:
      name: ${{ matrix.environment }}
      url: https://pypi.org/p/${{ matrix.project }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: pypi-${{ matrix.project }}
          path: dist
      - name: List distributions
        run: ls -l dist
      - name: Generate artifact attestations
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: "dist/*"
      - name: Publish to PyPI
        if: ${{ inputs.repository_url == '' }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
      - name: Publish to custom repository
        if: ${{ inputs.repository_url != '' }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          repository-url: ${{ inputs.repository_url }}
