name: Publish mlc-z3-static wheels

on:
  # Pull requests build only when this package's files change.
  pull_request:
    paths:
      - "packages/mlc-z3-static/**"
  workflow_dispatch:
    inputs:
      version_suffix:
        description: Python package version suffix, such as .post1
        required: false
        default: ""
      publish:
        description: Publish to PyPI
        type: boolean
        required: true
        default: false
      repository_url:
        description: Custom PyPI-compatible repository URL
        required: false
        default: ""

permissions:
  contents: read

jobs:
  build_wheels:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            os: ubuntu-latest
            build: cp311-manylinux_x86_64
            arch: x86_64
            platform_tag: manylinux_2_28_x86_64
          - name: Linux aarch64
            os: ubuntu-24.04-arm
            build: cp311-manylinux_aarch64
            arch: aarch64
            platform_tag: manylinux_2_28_aarch64
          - name: macOS arm64
            os: macos-15
            build: cp311-macosx_arm64
            arch: arm64
            platform_tag: macosx_14_0_arm64
          - name: macOS x86_64
            os: macos-15-intel
            build: cp311-macosx_x86_64
            arch: x86_64
            platform_tag: macosx_14_0_x86_64
          - name: Windows AMD64
            os: windows-2022
            build: cp311-win_amd64
            arch: AMD64
            platform_tag: win_amd64
          - name: Windows ARM64
            os: windows-11-arm
            build: cp311-win_arm64
            arch: ARM64
            platform_tag: win_arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: ./.github/actions/detect-env-vars
      - name: Stamp package version
        # Validates version.py and appends the optional suffix to __version__.
        shell: bash
        env:
          VERSION_SUFFIX: ${{ inputs.version_suffix }}
        run: |
          python -m pip install packaging
          python packages/mlc-z3-static/scripts/stamp_version.py --suffix "$VERSION_SUFFIX"
      - name: Build wheel
        # cibuildwheel must run from the package directory: the commands in
        # [tool.cibuildwheel] reference scripts/ relative to it.
        working-directory: packages/mlc-z3-static
        shell: bash
        env:
          CIBW_BUILD: ${{ matrix.build }}
          CIBW_ARCHS_LINUX: ${{ matrix.arch }}
          CIBW_ARCHS_MACOS: ${{ matrix.arch }}
          CIBW_ARCHS_WINDOWS: ${{ matrix.arch }}
          CIBW_BUILD_VERBOSITY: "1"
          CIBW_ENVIRONMENT_LINUX: >-
            CMAKE_BUILD_PARALLEL_LEVEL="${{ env.CMAKE_BUILD_PARALLEL_LEVEL }}"
          CIBW_ENVIRONMENT_MACOS: >-
            MACOSX_DEPLOYMENT_TARGET="14.0"
            CMAKE_BUILD_PARALLEL_LEVEL="${{ env.CMAKE_BUILD_PARALLEL_LEVEL }}"
          CIBW_ENVIRONMENT_WINDOWS: >-
            CMAKE_BUILD_PARALLEL_LEVEL="${{ env.CMAKE_BUILD_PARALLEL_LEVEL }}"
        run: |
          python -m pip install cibuildwheel==3.3.1
          python -m cibuildwheel --output-dir wheelhouse .
      - name: Retag Linux wheel
        # scikit-build-core tags Linux wheels linux_<arch>; retag to manylinux_2_28.
        if: startsWith(matrix.platform_tag, 'manylinux_')
        working-directory: packages/mlc-z3-static
        run: |
          python -m pip install wheel
          python -m wheel tags --remove --platform-tag "${{ matrix.platform_tag }}" wheelhouse/*.whl
      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: mlc-z3-static-wheel-${{ matrix.platform_tag }}
          path: packages/mlc-z3-static/wheelhouse/*.whl
          if-no-files-found: error

  build_sdist:
    name: Source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Stamp package version
        # Validates version.py and appends the optional suffix to __version__.
        shell: bash
        env:
          VERSION_SUFFIX: ${{ inputs.version_suffix }}
        run: |
          python -m pip install packaging
          python packages/mlc-z3-static/scripts/stamp_version.py --suffix "$VERSION_SUFFIX"
      - name: Build sdist
        working-directory: packages/mlc-z3-static
        run: pipx run build --sdist
      - name: Upload sdist artifact
        uses: actions/upload-artifact@v4
        with:
          name: mlc-z3-static-sdist
          path: packages/mlc-z3-static/dist/*.tar.gz
          if-no-files-found: error

  publish:
    name: Publish distributions
    needs: [build_wheels, build_sdist]
    if: ${{ inputs.publish }}
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: mlc-z3-static-*
          path: dist
          merge-multiple: true
      - name: List distributions
        run: ls -l dist
      - name: Generate artifact attestations
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: "dist/*"
      - name: Publish to PyPI
        if: ${{ inputs.repository_url == '' }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
      - name: Publish to custom repository
        if: ${{ inputs.repository_url != '' }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          repository-url: ${{ inputs.repository_url }}
